<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Shankar Diabetes CRM</title>
    <link rel="shortcut icon" href="assets/images/favicon.svg" />

    <link rel="stylesheet" href="assets/fonts/remix/remixicon.css" />
    <link rel="stylesheet" href="assets/css/main.min.css" />
    <link
      rel="stylesheet"
      href="assets/vendor/overlay-scroll/OverlayScrollbars.min.css"
    />

    <style>
      body {
        height: 100vh;
        margin: 0;
        background:
          linear-gradient(
            0deg,
            rgba(235, 244, 245, 0.678),
            rgba(181, 198, 224, 0.758)
          ),
          url("assets/images/login-bg.avif") center/cover no-repeat;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", sans-serif;
      }

      .login-card {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        padding: 40px;
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      .login-card img {
        width: 120px;
        margin-bottom: 20px;
      }

      .login-card h4 {
        margin-bottom: 25px;
        color: #333;
      }

      .form-control {
        border-radius: 8px;
      }

      .btn-primary {
        background-color: #007bff;
        border: none;
        border-radius: 8px;
      }

      .btn-secondary {
        border-radius: 8px;
      }

      a {
        color: #007bff;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <h1 class="fs-4">Shankar Diabetes CRM</h1>
      <h4>Login</h4>
      <form action="dashboard.html">
        <div class="mb-3 text-start">
          <label for="email" class="form-label"
            >Your email <span class="text-danger">*</span></label
          >
          <input
            type="text"
            id="email"
            class="form-control"
            placeholder="Enter your email"
          />
        </div>

        <div class="mb-3 text-start">
          <label for="pwd" class="form-label"
            >Your password <span class="text-danger">*</span></label
          >
          <div class="input-group">
            <input
              type="password"
              id="pwd"
              class="form-control"
              placeholder="Enter password"
            />
            <button class="btn btn-outline-secondary" type="button">
              <i class="ri-eye-line text-primary"></i>
            </button>
          </div>
        </div>

        <div class="d-flex justify-content-end mb-3">
          <a href="forgot-password.html">Forgot password?</a>
        </div>

        <div class="d-grid gap-2">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
    </div>
  </body>
</html>
